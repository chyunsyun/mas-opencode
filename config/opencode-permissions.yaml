# OpenCode のロール別権限マトリクス。
#
# scripts/build_instructions.sh が読み取り、.opencode/agents/*.md の
# permission frontmatter を生成する。パス内の {agent_id} は実際のIDへ展開される。
#
# 共通の edit_deny は生成物、保護対象、inbox を対象とする。
# 報告書は作成者が所有するため、係長にも編集を許可しない。

common:
  edit_deny:
    - AGENTS.md
    - .opencode/agents/*.md
    - .opencode/tools/*
    - config/opencode-permissions.yaml
    - config/settings.yaml
    - config/opencode-tui.json
    - queue/inbox/*.yaml

roles:
  director:
    question: deny
    read_deny:
      - queue/inbox/*
      - queue/tasks/*
    read_allow:
      - queue/inbox/{agent_id}.yaml
      - queue/commands.yaml
      - queue/commands_archive.yaml
      - queue/reports/*
      - dashboard.md
    edit_deny:
      - queue/tasks/*
      - queue/reports/*
      - queue/commands_archive.yaml
      - dashboard.md
    edit_allow:
      - queue/commands.yaml

  chief:
    question: deny
    read_deny:
      - queue/inbox/*
    read_allow:
      - queue/inbox/{agent_id}.yaml
      - queue/commands.yaml
      - queue/commands_archive.yaml
      - queue/tasks/*
      - queue/reports/*
      - dashboard.md
    edit_deny:
      - queue/reports/*
    edit_allow:
      - queue/commands.yaml
      - queue/commands_archive.yaml
      - queue/tasks/engineer*.yaml
      - queue/tasks/auditor.yaml
      - dashboard.md

  engineer:
    question: deny
    read_deny:
      - queue/inbox/*
      - queue/tasks/*
      - queue/reports/*
      - queue/commands.yaml
      - queue/commands_archive.yaml
    read_allow:
      - queue/inbox/{agent_id}.yaml
      - queue/tasks/{agent_id}.yaml
      - queue/reports/{agent_id}_report.yaml
    edit_deny:
      - queue/commands.yaml
      - queue/commands_archive.yaml
      - queue/tasks/*
      - queue/reports/*
      - dashboard.md
    edit_allow:
      - queue/tasks/{agent_id}.yaml
      - queue/reports/{agent_id}_report.yaml

  auditor:
    question: deny
    read_deny:
      - queue/inbox/*
      - queue/commands_archive.yaml
    read_allow:
      - queue/inbox/{agent_id}.yaml
      - queue/commands.yaml
      - queue/tasks/auditor.yaml
      - queue/tasks/engineer*.yaml
      - queue/reports/*
      - dashboard.md
    edit_deny:
      - queue/commands.yaml
      - queue/commands_archive.yaml
      - queue/tasks/*
      - queue/reports/*
      - dashboard.md
    edit_allow:
      - queue/reports/auditor_report.yaml
